<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReserveFlow 예약 캘린더</title>
    <link rel="stylesheet" href="css/reset.css" /><link rel="stylesheet" href="css/common.css" /><link rel="stylesheet" href="css/layout.css" /><link rel="stylesheet" href="css/components.css" /><link rel="stylesheet" href="css/pages.css" /><link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">R</span><div><strong>ReserveFlow</strong><small>예약 운영 콘솔</small></div></a><nav class="side-nav"><a href="index.html" data-nav>홈</a><a href="calendar.html" data-nav>캘린더</a><a href="reservations.html" data-nav>예약</a><a href="customers.html" data-nav>고객</a><a href="services.html" data-nav>서비스</a><a href="messages.html" data-nav>메시지</a><a href="settings.html" data-nav>설정</a></nav><div class="sidebar-footer"><strong>라벤더 스튜디오</strong><small>주간 예약표</small></div></aside>
      <main class="main" data-calendar>
        <header class="topbar"><div class="topbar-title"><small>캘린더</small><strong>예약 스케줄</strong></div><div class="topbar-actions"><button class="button" type="button" data-modal-open="#addModal">예약 추가</button></div></header>
        <section class="page-header"><div><h1>주간 예약 캘린더</h1><p>시간대별 예약 상태와 빈 시간을 확인합니다.</p></div><div class="segmented"><button class="active" type="button">오늘</button><button type="button">주간</button><button type="button">월간</button></div></section>
        <section class="summary-grid"><article class="card stat-card"><span>오늘 예약</span><strong>18</strong><small>확정 14건</small></article><article class="card stat-card warning"><span>대기</span><strong>4</strong><small>확인 필요</small></article><article class="card stat-card mint"><span>완료</span><strong>9</strong><small>정산 가능</small></article><article class="card stat-card danger"><span>취소</span><strong>1</strong><small>재안내 필요</small></article></section>
        <section class="calendar-shell" style="margin-top:16px;">
          <div class="panel">
            <div class="day-tabs"><button class="active" data-day-tab="화">화</button><button data-day-tab="수">수</button><button data-day-tab="목">목</button><button data-day-tab="금">금</button><button data-day-tab="토">토</button></div>
            <div class="mobile-reservation-list" data-mobile-reservations></div>
            <div class="week-schedule" data-week-schedule></div>
          </div>
          <aside class="panel detail-panel" data-calendar-detail></aside>
        </section>
      </main>
    </div>
    <nav class="bottom-nav"><a href="index.html" data-nav>홈</a><a href="calendar.html" data-nav>일정</a><a href="reservations.html" data-nav>예약</a><a href="customers.html" data-nav>고객</a><a href="services.html" data-nav>서비스</a><a href="messages.html" data-nav>알림</a><a href="settings.html" data-nav>설정</a></nav>
    <dialog class="modal" id="addModal"><form class="modal-form" method="dialog"><div class="panel-header"><div><h2>예약 추가</h2><small>실제 저장은 되지 않습니다.</small></div><button class="icon-button" type="button" data-modal-close>×</button></div><label for="calendarCustomer">고객명<input class="input" id="calendarCustomer" name="calendarCustomer" /></label><label for="calendarTime">시간<input class="input" id="calendarTime" name="calendarTime" type="time" /></label><menu><button class="button secondary" type="button" data-modal-close>취소</button><button class="button">저장</button></menu></form></dialog>
    <script src="js/toast.js"></script><script src="js/modal.js"></script><script src="js/menu.js"></script><script src="js/calendar.js"></script>
  </body>
</html>
