<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직접 주문해봐 · 라이브 데모</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #eaeaea; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Pretendard Variable", Pretendard, sans-serif;
        }

        .demo-info {
            text-align: center;
            margin-bottom: 24px;
        }

        .demo-info h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .demo-info p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .tablet-mockup {
            position: relative;
            width: 1040px;  
            height: 680px; 
            background-color: #1a1a1a; 
            border-radius: 40px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .iframe-wrapper {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 960px;
            height: 600px;
            border-radius: 16px;
            overflow: hidden;
            background-color: #fff;
        }

        .demo-frame {
            width: 1280px;
            height: 800px;
            border: none;
            transform: scale(0.75);
            transform-origin: top left;
        }
        .demo-back { display: none; }

        /* ── 좁은 화면: 태블릿 틀 대신 주문 화면을 꽉 채워 보여준다 ── */
        @media (max-width: 1100px) {
            /* 페이지는 고정하고 주문 화면 안에서만 스크롤 → 이중 스크롤 방지 */
            body {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                justify-content: flex-start;
                align-items: stretch;
                overflow: hidden;
            }
            .demo-info { flex-shrink: 0; }
            .demo-info { margin: 0; padding: 16px 16px 12px; }
            .demo-info h1 { font-size: 20px; }
            .demo-info p { font-size: 13px; word-break: keep-all; }
            .demo-back {
                display: inline-block;
                margin-bottom: 10px;
                font-size: 13px;
                font-weight: 700;
                color: #6b4f2a;
                text-decoration: none;
            }
            .tablet-mockup {
                flex: 1;
                min-height: 0;
                display: flex;
                width: 100%;
                height: auto;
                padding: 0;
                border-radius: 0;
                background: none;
                box-shadow: none;
            }
            .iframe-wrapper {
                position: static;
                flex: 1;
                min-height: 0;
                width: 100%;
                height: auto;
                border-radius: 0;
                border-top: 1px solid #d8c9b5;
            }
            .demo-frame {
                width: 100%;
                height: 100%;
                transform: none;
            }
        }
    </style>
</head>
<body>

    <div class="demo-info">
        <a href="../../index.html#s-cafe" class="demo-back">← 포트폴리오로</a>
        <h1>테이블오더 라이브 데모</h1>
        <p>화면의 메뉴를 선택하고 옵션을 변경하며 자유롭게 체험해 보세요.</p>
    </div>

    <div class="tablet-mockup">
        <div class="iframe-wrapper">
            <iframe class="demo-frame" title="테이블오더 화면"></iframe>
        </div>
    </div>

    <script>
        // 태블릿 틀 안에서는 스크롤을 막고, 좁은 화면에서는 내부 스크롤을 허용한다
        const frame = document.querySelector('.demo-frame');
        if (!matchMedia('(max-width: 1100px)').matches) frame.setAttribute('scrolling', 'no');
        frame.src = 'index.html';
    </script>
</body>
</html>
