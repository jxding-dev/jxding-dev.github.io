<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReserveFlow 매장 설정</title>
    <link rel="stylesheet" href="css/reset.css" /><link rel="stylesheet" href="css/common.css" /><link rel="stylesheet" href="css/layout.css" /><link rel="stylesheet" href="css/components.css" /><link rel="stylesheet" href="css/pages.css" /><link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="index.html"><span class="brand-mark">R</span><div><strong>ReserveFlow</strong><small>예약 운영 콘솔</small></div></a>
        <nav class="side-nav"><a href="index.html" data-nav>홈</a><a href="calendar.html" data-nav>캘린더</a><a href="reservations.html" data-nav>예약</a><a href="customers.html" data-nav>고객</a><a href="services.html" data-nav>서비스</a><a href="messages.html" data-nav>메시지</a><a href="settings.html" data-nav>설정</a></nav>
        <div class="sidebar-footer"><strong>라벤더 스튜디오</strong><small>운영 설정</small></div>
      </aside>
      <main class="main" data-settings>
        <header class="topbar">
          <div class="topbar-title"><small>설정</small><strong>매장 정보</strong></div>
          <div class="topbar-actions"><button class="button" type="submit" form="settingsForm">저장</button></div>
        </header>
        <section class="page-header">
          <div><h1>매장 정보/운영시간 설정</h1><p>운영시간은 예약 가능 시간 계산에 사용됩니다.</p></div>
        </section>
        <form id="settingsForm" class="settings-form" data-settings-form>
          <section class="panel">
            <div class="panel-header"><div><small>Store Profile</small><h2>매장 프로필</h2></div></div>
            <div class="settings-grid">
              <label for="storeName">매장명<input class="input" id="storeName" name="storeName" required value="라벤더 스튜디오" /></label>
              <label for="businessType">업종<select class="select" id="businessType" name="businessType" required><option>네일샵</option><option>미용실</option><option>PT샵</option><option>공방</option><option>상담실</option></select></label>
              <label for="phone">대표 연락처<input class="input" id="phone" name="phone" required value="010-0000-0000" /></label>
              <label for="address">주소<input class="input" id="address" name="address" required value="서울시 성동구 예약로 12" /></label>
              <label class="field-wide" for="intro">소개문<textarea class="textarea" id="intro" name="intro">소규모 예약제로 운영하는 프라이빗 스튜디오입니다.</textarea></label>
            </div>
          </section>
          <section class="panel">
            <div class="panel-header"><div><small>Business Hours</small><h2>운영 요일/시간</h2></div></div>
            <div class="settings-grid">
              <label for="days">운영 요일<input class="input" id="days" name="days" required value="월, 화, 수, 목, 금, 토" /></label>
              <label for="openTime">운영 시간<input class="input" id="openTime" name="openTime" required value="09:00 - 21:00" /></label>
              <label for="breakTime">휴게 시간<input class="input" id="breakTime" name="breakTime" value="13:00 - 14:00" /></label>
              <label for="closedDay">정기 휴무<input class="input" id="closedDay" name="closedDay" value="일요일" /></label>
            </div>
          </section>
          <section class="two-column-grid">
            <div class="panel">
              <div class="panel-header"><div><small>Rules</small><h2>예약 규칙</h2></div></div>
              <div class="settings-grid single">
                <label for="slot">예약 간격<select class="select" id="slot" name="slot"><option>30분</option><option>60분</option><option>90분</option></select></label>
                <label for="bookableRange">예약 가능 기간<select class="select" id="bookableRange" name="bookableRange"><option>14일 전부터</option><option>30일 전부터</option><option>60일 전부터</option></select></label>
                <label for="cancelLimit">변경/취소 가능 시간<select class="select" id="cancelLimit" name="cancelLimit"><option>예약 24시간 전까지</option><option>예약 12시간 전까지</option><option>예약 2시간 전까지</option></select></label>
              </div>
            </div>
            <div class="panel">
              <div class="panel-header"><div><small>Notification</small><h2>알림 설정</h2></div></div>
              <div class="settings-grid single">
                <label for="reminder">예약 리마인드<select class="select" id="reminder" name="reminder"><option>예약 1일 전</option><option>예약 2시간 전</option><option>발송 안 함</option></select></label>
                <label for="noShowText">노쇼 안내 문구<textarea class="textarea" id="noShowText" name="noShowText">예약 시간에 방문이 어려운 경우 미리 연락 부탁드립니다.</textarea></label>
              </div>
            </div>
          </section>
          <section class="panel danger-zone">
            <div><small>데모 데이터</small><h2>초기화</h2><p class="muted">저장된 데모 설정만 지웁니다.</p></div>
            <button class="button secondary" type="button" data-reset-settings>초기화</button>
          </section>
        </form>
      </main>
    </div>
    <nav class="bottom-nav"><a href="index.html" data-nav>홈</a><a href="calendar.html" data-nav>일정</a><a href="reservations.html" data-nav>예약</a><a href="customers.html" data-nav>고객</a><a href="services.html" data-nav>서비스</a><a href="messages.html" data-nav>알림</a><a href="settings.html" data-nav>설정</a></nav>
    <script src="js/toast.js"></script><script src="js/menu.js"></script><script src="js/settings.js"></script>
  </body>
</html>
