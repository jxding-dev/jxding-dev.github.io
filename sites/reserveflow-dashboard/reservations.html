<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReserveFlow 예약 관리</title>
    <link rel="stylesheet" href="css/reset.css" /><link rel="stylesheet" href="css/common.css" /><link rel="stylesheet" href="css/layout.css" /><link rel="stylesheet" href="css/components.css" /><link rel="stylesheet" href="css/pages.css" /><link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">R</span><div><strong>ReserveFlow</strong><small>예약 운영 콘솔</small></div></a><nav class="side-nav"><a href="index.html" data-nav>홈</a><a href="calendar.html" data-nav>캘린더</a><a href="reservations.html" data-nav>예약</a><a href="customers.html" data-nav>고객</a><a href="services.html" data-nav>서비스</a><a href="messages.html" data-nav>메시지</a><a href="settings.html" data-nav>설정</a></nav><div class="sidebar-footer"><strong>라벤더 스튜디오</strong><small>예약 상태 관리</small></div></aside>
      <main class="main" data-reservations>
        <header class="topbar"><div class="topbar-title"><small>예약</small><strong>예약 목록</strong></div><div class="topbar-actions"><button class="button" data-modal-open="#reservationModal" type="button">상세</button></div></header>
        <section class="page-header"><div><h1>예약 목록/상태 관리</h1><p>대기 중인 예약은 상태 변경이 필요합니다.</p></div></section>
        <section class="panel filter-panel">
          <button class="filter-toggle" type="button" data-filter-toggle aria-expanded="false">필터 열기</button>
          <div class="filter-bar reservation-filter" data-filter-content>
            <div class="filter-status-group"><button class="status-button active" data-filter="all" type="button">전체</button><button class="status-button" data-filter="confirmed" type="button">예약확정</button><button class="status-button" data-filter="pending" type="button">대기중</button><button class="status-button" data-filter="completed" type="button">방문완료</button><button class="status-button" data-filter="noshow" type="button">노쇼주의</button><button class="status-button" data-filter="payment" type="button">결제대기</button><button class="status-button" data-filter="canceled" type="button">취소</button></div>
            <div class="filter-fields"><input class="input compact-date" id="reservationDate" name="reservationDate" data-date-filter type="date" /><select class="select compact-service" id="reservationService" name="reservationService" data-service-select><option value="all">서비스 전체</option><option value="젤 네일 케어">젤 네일 케어</option><option value="PT 체험 세션">PT 체험 세션</option><option value="두피 케어">두피 케어</option><option value="퍼스널 컬러 상담">퍼스널 컬러 상담</option></select><input class="search" id="reservationSearch" name="reservationSearch" data-search type="search" placeholder="고객명, 연락처, 서비스 검색" /></div>
          </div>
        </section>
        <section class="panel" style="margin-top:16px;"><div class="table-wrap"><table class="data-table"><thead><tr><th>예약일시</th><th>고객명</th><th>연락처</th><th>서비스</th><th>담당자</th><th>상태</th><th>금액</th><th>관리</th></tr></thead><tbody data-reservation-body></tbody></table></div><div class="empty-state" data-empty>검색 조건에 맞는 예약이 없습니다.</div></section>
      </main>
    </div>
    <nav class="bottom-nav"><a href="index.html" data-nav>홈</a><a href="calendar.html" data-nav>일정</a><a href="reservations.html" data-nav>예약</a><a href="customers.html" data-nav>고객</a><a href="services.html" data-nav>서비스</a><a href="messages.html" data-nav>알림</a><a href="settings.html" data-nav>설정</a></nav>
    <dialog class="modal" id="reservationModal"><form class="modal-form" method="dialog"><div class="panel-header"><div><h2>예약 상세</h2><small>선택한 예약의 처리 상태입니다.</small></div><button class="icon-button" type="button" data-modal-close>×</button></div><div data-reservation-detail><p class="muted">예약을 선택하세요.</p></div><menu><button class="button secondary" type="button" data-modal-close>취소</button><button class="button">저장</button></menu></form></dialog>
    <script src="js/toast.js"></script><script src="js/modal.js"></script><script src="js/menu.js"></script><script src="js/reservations.js"></script>
  </body>
</html>
